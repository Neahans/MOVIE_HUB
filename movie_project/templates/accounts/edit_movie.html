{% extends 'accounts/base.html' %}

{% block title %}
Edit movie
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white">
                <h3 class="mb-0"> <i class="bi bi-person"></i>Edit Movie</h3>
            </div>


            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">

                    {% csrf_token %}

                    {{form.as_p}}
                    <br><br>
                    <button type="submit">Update Movie</button>

                </form>


            <br><br>

            <a href="{% url 'movie_detail' movie.id %}" class="btn btn-dark">Cancel</a>
            </div>
        </div>
    </div>

</div>


 {% endblock %}
