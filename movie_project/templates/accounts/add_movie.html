
{% extends 'accounts/base.html' %}
{% block title %}
Add Movie 
{% endblock %}

{% block content %}

<div class="row justify-content-center  ">
    <div class="col-md-8">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white">
                <h2 class="mb-0"> <i class="bi bi-film"></i> Add Movie</h2>
            </div>
        
    
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="mt-3">
         
        <button type="submit"> <i class="bi bi-plus-circle"></i> Add Movie</button>
        </div>
    </form>
        
    </div>
    </div>
    </div>
        
</div>


{% endblock %}
