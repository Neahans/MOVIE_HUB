{% extends 'accounts/base.html' %}

{% block title %}
delete movie
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white">
                <h3 class="mb-0"> <i class="bi bi-person"></i> Delete Movie</h3>
            </div>


            <div class="card-body">
                 <p> Are you sure you want to delete <strong> {{movie.title}} </strong>?</p>

                <form method="POST">
                    {% csrf_token %}
                    <br><br>
                    <button type="submit">yes,Delete</button>
                </form>
                <br><br>

                <a href="{% url 'movie_detail' movie.id %} " class="btn btn-dark">Cancel</a>
            </div>
        </div>
    </div>

</div>


 {% endblock %}
